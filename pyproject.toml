[project]
name = "billing-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "werkzeug==3.0.6",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.0",
]

[tool.vercel]
entrypoint = "api/index:app"
